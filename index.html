<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
<link rel="manifest" href="/manifest.webmanifest?v=3" />
<meta name="apple-mobile-web-app-title" content="LIM2" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="apple-mobile-web-app-orientation" content="landscape">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>LIM2</title>
<!-- Style minimal pour vérifier le toggle Jour/Nuit indépendamment de Tailwind -->
<style>
  :root {
    --bg: #f6f7f9;
    --fg: #0a0a0a;
  }
  [data-theme="dark"] {
    --bg: #0b0f1a;
    --fg: #e7e9ee;
  }
  html, body, #root, main {
    background: var(--bg);
    color: var(--fg);
    min-height: 100%;
  }
  /* Rendez le changement évident sur l'en-tête */
  header {
    transition: background-color 0.2s ease, color 0.2s ease;
  }
</style>
<script>
  /* Presentation PORTRAIT : active PAR DEFAUT depuis le 19/08. Il n'y a plus
     d'ecran de blocage du tout — l'ancien message « Tournez l'iPad » a ete
     retire, ainsi que la @media qui le portait.
     On ne memorise donc que l'EXCEPTION : la cle n'existe que si l'utilisateur
     a demande a FIGER la presentation paysage (case decochee dans Parametres).
     Lu ici, avant le montage de React, pour que les adaptations portrait
     n'apparaissent pas une fraction de seconde avant d'etre retirees.
     Sens sur : si ce script echoue, l'attribut est absent et les adaptations
     s'appliquent — c'est le comportement par defaut, pas un mur.
     NB : le manifeste declare "orientation": "landscape" et index.html porte un
     <meta apple-mobile-web-app-orientation>. iOS IGNORE les deux (constate : la
     tablette bascule malgre eux). Aucun verrouillage d'orientation n'est
     accessible depuis le web sur iPad ; le CSS est le seul levier. */
  try {
    if (localStorage.getItem('lim:portrait-fige') === '1') {
      document.documentElement.setAttribute('data-portrait-fige', '');
    }
  } catch (e) {}
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
